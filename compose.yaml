services:
  postgres:
    image: postgres:18.6
    container_name: retailpulse-postgres

    environment:
      POSTGRES_DB: retailpulse
      POSTGRES_USER: retailpulse_admin
      POSTGRES_PASSWORD: retailpulse_dev_password

    ports:
      - "5433:5432"

    volumes:
      - retailpulse_postgres_data:/var/lib/postgresql
      - ./source-system/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U retailpulse_admin -d retailpulse"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    container_name: retailpulse-spark

    working_dir: /app

    volumes:
      - .:/app

    environment:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: retailpulse
      DB_USER: retailpulse_admin
      DB_PASSWORD: retailpulse_dev_password

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "python",
        "databricks/silver/transform.py"
      ]

volumes:
  retailpulse_postgres_data: